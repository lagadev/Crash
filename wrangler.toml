name = "crash-game"
main = "src/index.ts"
compatibility_date = "2024-09-25"
compatibility_flags = ["nodejs_compat"]

# ---- Static frontend (Mini App UI) ----
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

# ---- D1 Database ----
[[d1_databases]]
binding = "DB"
database_name = "crash_game_db"
database_id = "5e183b38-caf4-44dc-a500-89791463ba44"

# ---- Durable Object ----
[[durable_objects.bindings]]
name = "CRASH_ROOM"
class_name = "CrashRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CrashRoom"]

# ---- Cron ----
[triggers]
crons = ["*/30 * * * *"]

[vars]
BOT_USERNAME = "LagahCrashBot"
MIN_WITHDRAW_STARS = "50"
HOUSE_EDGE = "0.03"

# Secrets:
# BOT_TOKEN
# ADMIN_KEY
